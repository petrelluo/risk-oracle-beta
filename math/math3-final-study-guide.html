<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 3 Final — Study Guide (Chapters 5–8)</title>
<style>
  :root{
    --ink:#1d1b16; --ink2:#524d42; --paper:#f7f3ea; --card:#fffdf8;
    --rule:#d8cfba; --accent:#8a2f24; --accent2:#2d5a4e; --hard:#b5651d;
    --grid:#d9d2c2; --axis:#7a7163;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:17px; line-height:1.5;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 18px 80px;}
  header.top{
    border-bottom:3px double var(--accent); padding:26px 0 16px; margin-bottom:6px;
  }
  header.top h1{
    font-size:30px;margin:0;letter-spacing:.3px;font-weight:700;
  }
  header.top .sub{color:var(--ink2);font-style:italic;margin-top:4px;font-size:16px;}
  nav.tabs{
    position:sticky;top:0;z-index:50;background:var(--paper);
    border-bottom:1px solid var(--rule); padding:8px 0; margin-bottom:22px;
    display:flex;flex-wrap:wrap;gap:6px;
  }
  nav.tabs button{
    font-family:inherit;font-size:13px;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--ink2);
    padding:5px 10px;border-radius:3px;
  }
  nav.tabs button:hover{border-color:var(--accent);color:var(--accent);}
  nav.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  nav.tabs .sp{flex:1 1 auto;}
  section.view{display:none;}
  section.view.active{display:block;}

  h2.qh{font-size:23px;margin:0 0 2px;border-bottom:1px solid var(--rule);padding-bottom:6px;}
  .meta{color:var(--ink2);font-size:14px;font-style:italic;margin:4px 0 16px;}
  .badge{display:inline-block;font-style:normal;font-size:11px;letter-spacing:.5px;
    text-transform:uppercase;padding:2px 7px;border-radius:3px;vertical-align:middle;margin-left:6px;}
  .badge.std{background:#e9e2d0;color:var(--accent2);}
  .badge.chal{background:var(--accent);color:#fff;}

  .toolbar{margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toolbar button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--accent2);
    background:var(--card);color:var(--accent2);padding:5px 12px;border-radius:3px;}
  .toolbar button:hover{background:var(--accent2);color:#fff;}
  .toolbar .note{color:var(--ink2);font-size:13px;font-style:italic;}

  ol.problems{
    margin:0;padding:0;list-style:none;
    column-count:2;column-gap:26px;
  }
  ol.problems > li{
    break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
    margin:0 0 13px;padding-left:26px;position:relative;
  }
  ol.problems > li .num{
    position:absolute;left:0;top:0;font-weight:700;color:var(--accent);min-width:22px;
  }
  .star{color:var(--hard);font-weight:700;}
  .qtext{display:block;}

  /* math typography */
  .fr{display:inline-grid;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.12;}
  .fr>.n{border-bottom:1.4px solid currentColor;padding:0 .34em 1px;white-space:nowrap;}
  .fr>.d{padding:1px .34em 0;white-space:nowrap;}
  .vin{border-top:1.4px solid currentColor;padding:0 .12em .02em;}
  sup.idx{font-size:.7em;vertical-align:.5em;margin-right:-.15em;}
  .sg{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-0.9em;margin:0 .12em;line-height:1;}
  .sg>.t{font-size:.62em;}
  .sg>.s{font-size:1.7em;line-height:.82;}
  .sg>.b{font-size:.62em;}
  .se{vertical-align:-0.1em;}
  .fn{font-style:normal;}

  /* graphs */
  svg.graph{display:block;margin:8px 0 2px;max-width:100%;height:auto;background:#fffefb;border:1px solid var(--rule);}
  svg.graph .gl{stroke:var(--grid);stroke-width:.7;}
  svg.graph .ax{stroke:var(--axis);stroke-width:1.3;}
  svg.graph text{fill:var(--ink2);font-family:Georgia,serif;font-size:10px;}
  svg.graph .crv{fill:none;stroke:var(--accent);stroke-width:1.8;}
  svg.graph .asy{stroke:var(--accent2);stroke-width:1.1;stroke-dasharray:4 3;}
  svg.graph .pt{fill:var(--accent);}

  /* answer keys */
  .akblock{border:1px solid var(--rule);background:var(--card);border-radius:4px;
    padding:14px 18px;margin:0 0 18px;break-inside:avoid;}
  .akblock h3{margin:0 0 8px;font-size:18px;color:var(--accent);}
  ol.answers{margin:0;padding-left:22px;}
  ol.answers > li{margin:0 0 7px;}

  /* home / study guide */
  .lead{font-size:18px;color:var(--ink2);max-width:70ch;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:18px 0;}
  .panel{border:1px solid var(--rule);background:var(--card);border-radius:5px;padding:16px 20px;}
  .panel h3{margin:0 0 6px;color:var(--accent2);font-size:19px;}
  .panel ul{margin:6px 0 0;padding-left:20px;}
  .panel li{margin:3px 0;}
  .howto{border-left:4px solid var(--accent);background:var(--card);padding:12px 18px;border-radius:0 5px 5px 0;margin:10px 0 0;}

  /* review guide */
  .rev{margin-top:8px;}
  .chapsec{margin:30px 0 8px;}
  .chapsec > h2{font-size:24px;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:5px;margin:0 0 4px;}
  .topic{margin:16px 0;break-inside:avoid;}
  .topic h4{margin:0 0 4px;font-size:18px;color:var(--accent2);}
  .topic p{margin:5px 0;}
  .topic .key{font-weight:700;}
  .fbox{background:#efe8d8;border-radius:4px;padding:7px 12px;margin:7px 0;font-size:16px;}
  .eg{border-left:3px solid var(--accent2);background:var(--card);padding:9px 14px;margin:9px 0;border-radius:0 4px 4px 0;}
  .eg .lbl{font-style:italic;color:var(--accent2);font-weight:700;font-size:14px;}
  .pitfall{border-left:3px solid var(--hard);background:#fbf2e6;padding:9px 14px;margin:12px 0 0;border-radius:0 4px 4px 0;}
  .pitfall .lbl{font-weight:700;color:var(--hard);font-size:14px;}

  /* cheat sheet */
  .cs{column-count:2;column-gap:26px;}
  .csbox{break-inside:avoid;border:1px solid var(--rule);background:var(--card);border-radius:5px;
    padding:12px 15px;margin:0 0 16px;}
  .csbox h3{margin:0 0 6px;font-size:17px;color:var(--accent);border-bottom:1px solid var(--rule);padding-bottom:4px;}
  .csbox p{margin:5px 0;}
  .csbox .k{font-weight:700;color:var(--accent2);}
  table.tri{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0;}
  table.tri td,table.tri th{border:1px solid var(--rule);padding:3px 6px;text-align:center;}
  svg.unit{display:block;margin:6px auto;max-width:100%;height:auto;}
  svg.unit text{font-family:Georgia,serif;}

  footer{margin-top:40px;border-top:1px solid var(--rule);padding-top:14px;color:var(--ink2);font-size:13px;}

  @media (max-width:760px){
    ol.problems,.cs{column-count:1;}
    .grid2{grid-template-columns:1fr;}
  }

  /* ---------- PRINT ---------- */
  @page{size:A4;margin:14mm;}
  @media print{
    body{background:#fff;font-size:11pt;color:#000;}
    .wrap{max-width:none;padding:0;}
    nav.tabs,.toolbar,header.top .sub,footer,.noprint{display:none !important;}
    header.top{border-bottom:2px solid #000;padding:0 0 6px;margin:0 0 10px;}
    header.top h1{font-size:18pt;}
    section.view{display:none !important;}
    section.view.active{display:block !important;}
    ol.problems{column-gap:14px;}
    ol.problems > li{margin-bottom:9px;}
    h2.qh{font-size:15pt;}
    svg.graph{border:1px solid #999;background:#fff;}
    .akblock,.csbox,.panel{border:1px solid #999;}
    .cs{column-gap:16px;}
    a[href]{color:#000;text-decoration:none;}
  }
</style>
</head>

<script>
/* ============ math helpers ============ */
function sup(e){return "<sup>"+e+"</sup>";}
function sub(b){return "<sub>"+b+"</sub>";}
function fr(n,d){return '<span class="fr"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>';}
function sq(x){return "&radic;<span class='vin'>"+x+"</span>";}
function rt(i,x){return "<sup class='idx'>"+i+"</sup>&radic;<span class='vin'>"+x+"</span>";}
function pw(b,e){return b+sup(e);}
function lg(b,a){return "<span class='fn'>log</span>"+sub(b)+"&thinsp;"+a;}
function ln(a){return "<span class='fn'>ln</span>&thinsp;"+a;}
function lOG(a){return "<span class='fn'>log</span>&thinsp;"+a;}
function trg(f,a){return "<span class='fn'>"+f+"</span>&thinsp;"+a;}
function sumn(t,b,expr){return "<span class='sg'><span class='t'>"+t+"</span><span class='s'>&Sigma;</span><span class='b'>"+b+"</span></span><span class='se'>"+expr+"</span>";}
var PI="&pi;", TH="&theta;", DEG="&deg;", LE="&le;", GE="&ge;", NE="&ne;", PM="&plusmn;", INF="&infin;", AP="&asymp;", TO="&rarr;", CD="&middot;", MN="&minus;", IN="&isin;", times="&times;";

/* ============ coordinate grid generator (blank, for graphing) ============ */
function grid(o){
  o=Object.assign({xmin:-6,xmax:6,ymin:-6,ymax:6,xt:1,yt:1,xpi:false,w:300,h:226,pad:16,
                   xlab:2,ylab:2},o);
  var xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax,xt=o.xt,yt=o.yt,w=o.w,h=o.h,pad=o.pad;
  function X(x){return pad+(x-xmin)/(xmax-xmin)*(w-2*pad);}
  function Y(y){return h-pad-(y-ymin)/(ymax-ymin)*(h-2*pad);}
  var s='<svg class="graph" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">';
  var x,y;
  for(x=Math.ceil(xmin/xt)*xt;x<=xmax+1e-9;x+=xt) s+='<line class="gl" x1="'+X(x).toFixed(1)+'" y1="'+Y(ymax)+'" x2="'+X(x).toFixed(1)+'" y2="'+Y(ymin)+'"/>';
  for(y=Math.ceil(ymin/yt)*yt;y<=ymax+1e-9;y+=yt) s+='<line class="gl" x1="'+X(xmin)+'" y1="'+Y(y).toFixed(1)+'" x2="'+X(xmax)+'" y2="'+Y(y).toFixed(1)+'"/>';
  // axes
  s+='<line class="ax" x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'"/>';
  s+='<line class="ax" x1="'+X(0)+'" y1="'+Y(ymax)+'" x2="'+X(0)+'" y2="'+Y(ymin)+'"/>';
  // arrows
  function ar(px,py,dx,dy){var a=6;return '<path d="M'+px+' '+py+' L'+(px-dx*a-dy*a*0.5)+' '+(py-dy*a+dx*a*0.5)+' M'+px+' '+py+' L'+(px-dx*a+dy*a*0.5)+' '+(py-dy*a-dx*a*0.5)+'" stroke="var(--axis)" stroke-width="1.3" fill="none"/>';}
  s+=ar(X(xmax),Y(0),1,0)+ar(X(xmin),Y(0),-1,0)+ar(X(0),Y(ymax),0,-1)+ar(X(0),Y(ymin),0,1);
  // labels
  if(o.xpi){
    for(x=Math.ceil(xmin/xt)*xt;x<=xmax+1e-9;x+=xt){
      var k=Math.round(x/Math.PI*2); if(k===0) continue;
      if(k%2!==0) continue; // label whole multiples of pi only
      var m=k/2, lab=(m===1?"\u03c0":(m===-1?"\u2212\u03c0":(m+"\u03c0")));
      s+='<text x="'+X(x).toFixed(1)+'" y="'+(Y(0)+13)+'" text-anchor="middle">'+lab+'</text>';
    }
  } else {
    for(x=Math.ceil(xmin/xt)*xt;x<=xmax+1e-9;x+=xt){ var xi=Math.round(x);
      if(xi===0||Math.abs(xi)%o.xlab!==0) continue;
      s+='<text x="'+X(x).toFixed(1)+'" y="'+(Y(0)+12)+'" text-anchor="middle">'+xi+'</text>';}
  }
  for(y=Math.ceil(ymin/yt)*yt;y<=ymax+1e-9;y+=yt){ var yi=Math.round(y);
    if(yi===0||Math.abs(yi)%o.ylab!==0) continue;
    s+='<text x="'+(X(0)-5)+'" y="'+(Y(y)+3.5).toFixed(1)+'" text-anchor="end">'+yi+'</text>';}
  s+='</svg>';
  return s;
}

/* ============ unit circle for cheat sheet ============ */
function unitCircle(){
  var R=120,cx=160,cy=160,w=320,h=320;
  var s='<svg class="unit" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--accent2)" stroke-width="1.4"/>';
  s+='<line x1="'+(cx-R-14)+'" y1="'+cy+'" x2="'+(cx+R+14)+'" y2="'+cy+'" stroke="var(--axis)" stroke-width="1"/>';
  s+='<line x1="'+cx+'" y1="'+(cy-R-14)+'" x2="'+cx+'" y2="'+(cy+R+14)+'" stroke="var(--axis)" stroke-width="1"/>';
  var data=[
   [0,"0","(1, 0)"],[30,"\u03c0/6","(\u221a3/2, 1/2)"],[45,"\u03c0/4","(\u221a2/2, \u221a2/2)"],
   [60,"\u03c0/3","(1/2, \u221a3/2)"],[90,"\u03c0/2","(0, 1)"],[120,"2\u03c0/3","(\u22121/2, \u221a3/2)"],
   [135,"3\u03c0/4","(\u2212\u221a2/2, \u221a2/2)"],[150,"5\u03c0/6","(\u2212\u221a3/2, 1/2)"],
   [180,"\u03c0","(\u22121, 0)"],[210,"7\u03c0/6","(\u2212\u221a3/2, \u22121/2)"],
   [225,"5\u03c0/4","(\u2212\u221a2/2, \u2212\u221a2/2)"],[240,"4\u03c0/3","(\u22121/2, \u2212\u221a3/2)"],
   [270,"3\u03c0/2","(0, \u22121)"],[300,"5\u03c0/3","(1/2, \u2212\u221a3/2)"],
   [315,"7\u03c0/4","(\u221a2/2, \u2212\u221a2/2)"],[330,"11\u03c0/6","(\u221a3/2, \u2212\u221a2/2)"]];
  // fix 330 coord typo
  data[15][2]="(\u221a3/2, \u22121/2)";
  for(var i=0;i<data.length;i++){
    var a=data[i][0]*Math.PI/180;
    var px=cx+R*Math.cos(a), py=cy-R*Math.sin(a);
    s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="2.4" fill="var(--accent)"/>';
    var lx=cx+(R+4)*Math.cos(a), ly=cy-(R+4)*Math.sin(a);
    var anc=(Math.cos(a)>0.2?"start":(Math.cos(a)<-0.2?"end":"middle"));
    var dy=(Math.sin(a)>0.2?-2:(Math.sin(a)<-0.2?9:3));
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+dy).toFixed(1)+'" text-anchor="'+anc+'" font-size="8" fill="var(--accent2)">'+data[i][1]+'</text>';
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+dy+8.5).toFixed(1)+'" text-anchor="'+anc+'" font-size="7" fill="var(--ink2)">'+data[i][2]+'</text>';
  }
  s+='<text x="'+(cx)+'" y="'+(cy-4)+'" text-anchor="middle" font-size="8" fill="var(--ink2)">(cos&#952;, sin&#952;)</text>';
  s+='</svg>';
  return s;
}

/* ============ sine/cosine reference graph ============ */
function sineRef(){
  var w=320,h=150,pad=18;
  var xmin=0,xmax=2*Math.PI,ymin=-1.4,ymax=1.4;
  function X(x){return pad+(x-xmin)/(xmax-xmin)*(w-2*pad);}
  function Y(y){return h-pad-(y-ymin)/(ymax-ymin)*(h-2*pad);}
  var s='<svg class="graph" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<line class="ax" x1="0" y1="'+Y(0)+'" x2="'+w+'" y2="'+Y(0)+'"/>';
  var d1="",d2="",x,first=true;
  for(x=0;x<=2*Math.PI+0.01;x+=0.08){
    d1+=(first?"M":"L")+X(x).toFixed(1)+" "+Y(Math.sin(x)).toFixed(1)+" ";
    d2+=(first?"M":"L")+X(x).toFixed(1)+" "+Y(Math.cos(x)).toFixed(1)+" ";
    first=false;
  }
  s+='<path d="'+d1+'" class="crv"/>';
  s+='<path d="'+d2+'" class="crv" style="stroke:var(--accent2)"/>';
  s+='<text x="'+X(Math.PI/2)+'" y="14" text-anchor="middle" fill="var(--accent)">sin x</text>';
  s+='<text x="'+X(0.2)+'" y="14" fill="var(--accent2)">cos x</text>';
  [["\u03c0",Math.PI],["2\u03c0",2*Math.PI]].forEach(function(t){
    s+='<text x="'+X(t[1]).toFixed(1)+'" y="'+(Y(0)+12)+'" text-anchor="middle">'+t[0]+'</text>';});
  s+='</svg>';
  return s;
}

/* =================== QUIZ DATA =================== */
/* Each problem: {q, a, grid?(svg), hard?} */

var QUIZZES=[
/* ---------------- QUIZ 1 (standard) ---------------- */
{level:"std",problems:[
 {q:"Simplify: "+fr("16e"+sup(5),"4e"+sup(2)),a:"4e"+sup(3)+" &nbsp;(divide coefficients, subtract exponents)"},
 {q:"Evaluate: "+lg(2,"32"),a:"5 &nbsp;(2"+sup(5)+"=32)"},
 {q:"Write 4"+sup(3)+"=64 in logarithmic form.",a:lg(4,"64")+"=3"},
 {q:"Solve: 9"+sup("x")+"=27.",a:"3"+sup("2x")+"=3"+sup(3)+" "+TO+" 2x=3 "+TO+" x="+fr(3,2)},
 {q:"Expand: "+lg(3,"(9x"+sup(4)+")"),a:"2 + 4"+lg(3,"x")},
 {q:"Solve, round to 3 decimals: 5"+sup("x")+"=20.",a:"x="+lg(5,"20")+"="+fr(ln("20"),ln("5"))+" "+AP+" 1.861"},
 {q:"y varies inversely with x, and y=6 when x=3. Write the equation, then find y when x=9.",a:"xy=18, so y="+fr("18","x")+"; &nbsp;x=9 "+TO+" y=2"},
 {q:"Simplify and state restrictions: "+fr("x"+sup(2)+MN+"9","x"+sup(2)+MN+"x"+MN+"6"),a:fr("(x"+MN+"3)(x+3)","(x"+MN+"3)(x+2)")+"="+fr("x+3","x+2")+", x"+NE+"3,"+MN+"2"},
 {q:"Add: "+fr(3,"x")+" + "+fr(2,"x+1"),a:fr("3(x+1)+2x","x(x+1)")+"="+fr("5x+3","x(x+1)")},
 {q:"For 7, 10, 13, 16, &hellip; write a rule for a"+sub("n")+" and find a"+sub("15")+".",a:"d=3, a"+sub("n")+"=3n+4; &nbsp;a"+sub("15")+"=49"},
 {q:"Find the sum of the first 6 terms of 3, 6, 12, &hellip;",a:"a"+sub(1)+"=3, r=2; S"+sub(6)+"="+fr("3(1"+MN+"2"+sup(6)+")","1"+MN+"2")+"=189"},
 {q:"A right triangle has legs 5 and 12. Find sin, cos, tan of the angle "+TH+" opposite the side of length 5.",a:"hyp=13; sin"+TH+"="+fr(5,13)+", cos"+TH+"="+fr(12,13)+", tan"+TH+"="+fr(5,12)},
 {q:"Convert 135"+DEG+" to radians.",a:"135"+CD+fr(PI,"180")+"="+fr("3"+PI,4)},
 {q:"Graph y="+lg(2,"x")+". State the asymptote, domain, and range.",grid:grid({xmin:-1,xmax:9,ymin:-4,ymax:4,xlab:2,ylab:1}),
   a:"Points (1,0), (2,1), (4,2), ("+fr(1,2)+",&minus;1). Vertical asymptote x=0; domain x&gt;0; range all reals."},
 {q:"Evaluate exactly: cos 240"+DEG+".",hard:true,a:"Quadrant III, reference 60"+DEG+" "+TO+" cos negative: "+MN+fr(1,2)}
]},
/* ---------------- QUIZ 2 (standard) ---------------- */
{level:"std",problems:[
 {q:"Simplify: (2e"+sup("&minus;3x")+")"+sup(5),a:"32e"+sup("&minus;15x")+"="+fr("32","e"+sup("15x"))},
 {q:"Evaluate: "+lg("1/3","27"),a:MN+"3 &nbsp;(("+fr(1,3)+")"+sup("&minus;3")+"=27)"},
 {q:"Write "+lg(5,"125")+"=3 in exponential form.",a:"5"+sup(3)+"=125"},
 {q:"Simplify: e"+sup(ln("7")),a:"7"},
 {q:"Condense to one logarithm: "+lOG("6")+" + 4"+lOG("3")+" "+MN+" "+lOG("3"),a:lOG("6")+"+"+lOG("3"+sup(3))+"="+lOG("(6"+CD+"27)")+"="+lOG("162")},
 {q:"$2000 is invested at 4% annual interest, compounded quarterly. Find the balance after 5 years.",a:"A=2000(1+"+fr(".04","4")+")"+sup("4"+CD+"5")+"=2000(1.01)"+sup("20")+" "+AP+" $2440.38"},

/* =================== CHEAT SHEET =================== */
function cheatSheet(){
  var s='<h2 class="qh">Final Cheat Sheet — Chapters 5&ndash;8</h2>';
  s+='<div class="meta">Every formula you should have at your fingertips. Printable on its own.</div>';
  s+='<div class="toolbar noprint"><button onclick="printOnly(\'sec-cheat\')">Print cheat sheet</button></div>';
  s+='<div class="cs">';

  s+='<div class="csbox"><h3>Ch 5 &middot; Exponent &amp; e Rules</h3>'
    +'<p>'+pw("b","m")+CD+pw("b","n")+"="+pw("b","m+n")+'; &nbsp;'+fr(pw("b","m"),pw("b","n"))+"="+pw("b","m&minus;n")+'; &nbsp;('+pw("b","m")+")"+sup("n")+"="+pw("b","mn")+'</p>'
    +'<p>'+pw("b","&minus;n")+"="+fr("1",pw("b","n"))+'; &nbsp;'+pw("b","0")+'=1; &nbsp;e '+AP+' 2.718 (irrational)</p>'
    +'<p><span class="k">Growth/decay:</span> y='+pw("b","x")+', b&gt;1 growth, 0&lt;b&lt;1 decay; asymptote y=0.</p>'
    +'<p><span class="k">Interest:</span> A=P(1+'+fr("r","n")+")"+sup("nt")+' (n times/yr); &nbsp;A=Pe'+sup("rt")+' (continuous).</p></div>';

  s+='<div class="csbox"><h3>Ch 5 &middot; Logarithms</h3>'
    +'<p><span class="k">Definition:</span> '+pw("b","x")+"=y &harr; "+lg("b","y")+"=x. &nbsp;log="+lg("10","")+", ln="+lg("e","")+'.</p>'
    +'<p>'+lg("b","b")+"=1; "+lg("b","1")+"=0; "+lg("b",pw("b","x"))+"=x; "+pw("b",lg("b","x"))+"=x.</p>"
    +'<p><span class="k">Properties:</span> '+lg("b","(mn)")+"="+lg("b","m")+"+"+lg("b","n")+"; &nbsp;"+lg("b",fr("m","n"))+"="+lg("b","m")+MN+lg("b","n")+"; &nbsp;"+lg("b",pw("m","n"))+"=n"+lg("b","m")+'.</p>'
    +'<p><span class="k">Change of base:</span> '+lg("b","x")+"="+fr(lg("c","x"),lg("c","b"))+"="+fr(ln("x"),ln("b"))+'.</p>'
    +'<p><span class="k">Solving:</span> same base &rarr; set exponents equal; otherwise take a log of both sides. Always <b>check log equations</b> for extraneous solutions (arguments must be &gt;0).</p>'
    +'<p><span class="k">Cooling:</span> T=(T'+sub(0)+MN+"T"+sub("R")+")e"+sup("&minus;rt")+"+T"+sub("R")+'.</p></div>';

  s+='<div class="csbox"><h3>Ch 6 &middot; Rational Functions</h3>'
    +'<p><span class="k">Direct:</span> y=ax (or '+fr("y","x")+'=a). <span class="k">Inverse:</span> xy=a (or y='+fr("a","x")+').</p>'
    +'<p><span class="k">Parent:</span> y='+fr("1","x")+', asymptotes x=0, y=0.</p>'
    +'<p>For y='+fr("a","x"+MN+"h")+"+k: asymptotes x=h, y=k.</p>"
    +'<p>For '+fr("linear","linear")+': use long division to write as '+fr("a","x"+MN+"h")+'+k.</p>'
    +'<p><span class="k">Simplify/&times;/&divide;:</span> factor, divide out common factors (track domain restrictions); divide = multiply by reciprocal.</p>'
    +'<p><span class="k">+ / &minus;:</span> get the LCD first.</p>'
    +'<p><span class="k">Solving:</span> multiply both sides by the LCD (or cross-multiply a proportion); <b>check for extraneous solutions</b>.</p></div>';

  s+='<div class="csbox"><h3>Ch 7 &middot; Sequences &amp; Series</h3>'
    +'<p><span class="k">Summation:</span> '+sumn("n","i=1","a"+sub("i"))+" = a"+sub(1)+"+a"+sub(2)+"+&hellip;+a"+sub("n")+'.</p>'
    +'<p><span class="k">Arithmetic</span> (common difference d): a'+sub("n")+"=a"+sub(1)+"+(n"+MN+"1)d; &nbsp;S"+sub("n")+"="+fr("n","2")+"(a"+sub(1)+"+a"+sub("n")+').</p>'
    +'<p><span class="k">Geometric</span> (common ratio r): a'+sub("n")+"=a"+sub(1)+pw("r","n&minus;1")+"; &nbsp;S"+sub("n")+"=a"+sub(1)+fr("1"+MN+pw("r","n"),"1"+MN+"r")+'.</p>'
    +'<p><span class="k">Infinite geometric:</span> S='+fr("a"+sub(1),"1"+MN+"r")+', only if &minus;1&lt;r&lt;1.</p>'
    +'<p><span class="k">Means:</span> arithmetic '+fr("a+c","2")+'; geometric '+sq("ac")+'.</p>'
    +'<p><span class="k">Recursive:</span> give starting term(s) + equation relating a'+sub("n")+" to previous terms.</p></div>";

  s+='<div class="csbox"><h3>Ch 8 &middot; Right-Triangle Trig</h3>'
    +'<p>SOH&middot;CAH&middot;TOA: sin'+TH+"="+fr("opp","hyp")+", cos"+TH+"="+fr("adj","hyp")+", tan"+TH+"="+fr("opp","adj")+'.</p>'
    +'<p>Reciprocals: csc='+fr("1","sin")+", sec="+fr("1","cos")+", cot="+fr("1","tan")+'.</p>'
    +'<p>Pythagorean: a'+sup(2)+"+b"+sup(2)+"=c"+sup(2)+'. Triples: (3,4,5),(5,12,13),(8,15,17),(7,24,25).</p>'
    +'<table class="tri"><tr><th>'+TH+'</th><th>sin</th><th>cos</th><th>tan</th></tr>'
    +'<tr><td>30'+DEG+'</td><td>'+fr(1,2)+'</td><td>'+fr(sq("3"),2)+'</td><td>'+fr(sq("3"),3)+'</td></tr>'
    +'<tr><td>45'+DEG+'</td><td>'+fr(sq("2"),2)+'</td><td>'+fr(sq("2"),2)+'</td><td>1</td></tr>'
    +'<tr><td>60'+DEG+'</td><td>'+fr(sq("3"),2)+'</td><td>'+fr(1,2)+'</td><td>'+sq("3")+'</td></tr></table>'
    +'<p>Special triangles: 45-45-90 sides 1:1:'+sq("2")+'; &nbsp;30-60-90 sides 1:'+sq("3")+':2.</p></div>';

  s+='<div class="csbox"><h3>Ch 8 &middot; Angles &amp; the Circle</h3>'
    +'<p><span class="k">Coterminal:</span> '+TH+" + 360"+DEG+CD+"n (or "+TH+"+2"+PI+"n).</p>"
    +'<p><span class="k">Radians:</span> 180'+DEG+"="+PI+" rad; multiply by "+fr(PI,"180"+DEG)+" or "+fr("180"+DEG,PI)+" to convert.</p>"
    +'<p><span class="k">Arc length:</span> s='+TH+"r &nbsp;(&theta; in radians). <span class='k'>Sector area:</span> A="+fr(1,2)+TH+"r"+sup(2)+'.</p>'
    +'<p><span class="k">Any angle</span> through (x,y), r='+sq("x"+sup(2)+"+y"+sup(2))+": sin="+fr("y","r")+", cos="+fr("x","r")+", tan="+fr("y","x")+'.</p>'
    +'<p><span class="k">Reference angle</span> '+TH+"': acute angle to the x-axis. Signs by quadrant (<b>A</b>ll, <b>S</b>in, <b>T</b>an, <b>C</b>os positive): "
    +'</p>'+unitCircle()+'</div>';

  s+='<div class="csbox"><h3>Ch 8 &middot; Graphing Trig</h3>'
    +'<p>y=a sin b(x'+MN+"h)+k &nbsp;(and cos): <span class='k'>amplitude</span> |a|, <span class='k'>period</span> "+fr("2"+PI,"b")+", phase shift h, midline y=k.</p>"
    +'<p>Steps: draw midline y=k; solve 0'+LE+"b(x"+MN+"h)"+LE+"2"+PI+"; plot 5 key points; if a&lt;0 reflect over midline.</p>"
    +'<p>tan x &amp; cot x: period '+PI+', no amplitude. tan asymptotes at '+PM+fr(PI,2)+"+&pi;n; cot asymptotes at &pi;n.</p>"
    +'<p>sec x='+fr("1","cos x")+", csc x="+fr("1","sin x")+": period 2"+PI+", asymptotes where cos (resp. sin) = 0.</p>"
    +sineRef()+'</div>';

  s+='</div>';
  return s;
}

  /* ---------- CHAPTER 6 ---------- */
  s+='<div class="chapsec"><h2>Chapter 6 &middot; Rational Functions</h2>';
  s+=topic("6.1 &nbsp;Direct vs. inverse variation",
    "<p><span class='key'>Direct:</span> y=ax (the ratio "+fr("y","x")+" is constant). <span class='key'>Inverse:</span> xy=a, i.e. y="+fr("a","x")+" (the product xy is constant). To classify a table, test which one stays constant.</p>"
    +eg("y=12 when x=3 and the variation is inverse "+TO+" a=xy=36 "+TO+" y="+fr("36","x")+"."));
  s+=topic("6.2 &nbsp;Graphing rational functions",
    "<p>Parent y="+fr("1","x")+" has asymptotes x=0 and y=0. For y="+fr("a","x"+MN+"h")+"+k: <span class='key'>vertical asymptote x=h, horizontal asymptote y=k</span>; domain x"+NE+"h, range y"+NE+"k.</p>"
    +"<p>For a "+fr("linear","linear")+" function, use long division to rewrite it as quotient + "+fr("remainder","x"+MN+"h")+"; the quotient is the horizontal asymptote.</p>"
    +eg(fr("2x+5","x+2")+" = 2 + "+fr("1","x+2")+" "+TO+" VA x="+MN+"2, HA y=2."));
  s+=topic("6.3 &nbsp;Multiplying &amp; dividing",
    "<p>Factor every numerator and denominator, divide out common <u>factors</u>, and state restrictions (any value that makes an original denominator 0). To divide, <span class='key'>multiply by the reciprocal</span>.</p>"
    +eg(fr("x"+sup(2)+MN+"9","x"+sup(2)+"+4x+3")+CD+fr("x+1","x"+MN+"3")+" = "+fr("(x"+MN+"3)(x+3)","(x+3)(x+1)")+CD+fr("x+1","x"+MN+"3")+" = 1, x"+NE+MN+"3,"+MN+"1,3."));
  s+=topic("6.4 &nbsp;Adding &amp; subtracting",
    "<p>Find the <span class='key'>LCD</span> from the factored denominators, rewrite each fraction over it, combine the numerators, then simplify.</p>"
    +eg(fr("2","x")+"+"+fr("3","x+1")+" = "+fr("2(x+1)+3x","x(x+1)")+" = "+fr("5x+2","x(x+1)")+"."));
  s+=topic("6.5 &nbsp;Solving rational equations",
    "<p><span class='key'>Cross-multiply</span> when it is one fraction = one fraction; otherwise <span class='key'>multiply every term by the LCD</span> and solve. Always check for extraneous solutions. Word problems: average cost = "+fr("total cost","number")+", plus mixture and rate models.</p>"
    +eg(fr("1","x"+MN+"2")+"+1="+fr("4","x"+MN+"2")+" "+TO+" 1+(x"+MN+"2)=4 "+TO+" x=5 (valid)."));
  s+=pit("Cancel <u>factors</u>, never individual terms: "+fr("x+3","x")+" is not "+fr("3","1")+". And a value that zeroes a denominator is always rejected, even if the algebra produces it.");
  s+='</div>';

  /* ---------- CHAPTER 7 ---------- */
  s+='<div class="chapsec"><h2>Chapter 7 &middot; Sequences &amp; Series</h2>';
  s+=topic("7.1&ndash;7.2 &nbsp;Sequences, series, and "+String.fromCharCode(931)+" notation",
    "<p>A sequence is a function on the positive integers; a"+sub("n")+" is the nth term. An <span class='key'>explicit</span> rule gives a"+sub("n")+" from n; a <span class='key'>recursive</span> rule gives a"+sub("n")+" from earlier terms plus a starting value. A series is the sum of a sequence's terms.</p>"
    +eg(sumn("4","k=1","(2k+1)")+" = 3+5+7+9 = 24."));
  s+=topic("7.3 &nbsp;Arithmetic sequences &amp; series",
    "<p>Constant <span class='key'>common difference</span> d = a"+sub("n")+MN+"a"+sub("n&minus;1")+".</p>"
    +fbox("a"+sub("n")+"=a"+sub(1)+"+(n"+MN+"1)d &nbsp;&bull;&nbsp; S"+sub("n")+"="+fr("n","2")+"(a"+sub(1)+"+a"+sub("n")+")")
    +eg("4, 7, 10, &hellip;: d=3, a"+sub("n")+"=3n+1; S"+sub("10")+"="+fr("10","2")+"(4+31)=175."));
  s+=topic("7.4 &nbsp;Geometric sequences &amp; series",
    "<p>Constant <span class='key'>common ratio</span> r = "+fr("a"+sub("n"),"a"+sub("n&minus;1"))+".</p>"
    +fbox("a"+sub("n")+"=a"+sub(1)+CD+pw("r","n"+MN+"1")+" &nbsp;&bull;&nbsp; S"+sub("n")+"=a"+sub(1)+fr("1"+MN+pw("r","n"),"1"+MN+"r")+" &nbsp;&bull;&nbsp; Infinite (|r|&lt;1): S="+fr("a"+sub(1),"1"+MN+"r"))
    +"<p>If |r|"+GE+"1 an infinite geometric series has no sum. Means: arithmetic "+fr("a+c","2")+", geometric "+sq("ac")+". Repeating decimals are infinite geometric series.</p>"
    +eg("2, 6, 18, &hellip;: r=3, a"+sub("n")+"=2"+CD+pw("3","n"+MN+"1")+"; S"+sub(5)+"=2"+fr("1"+MN+"3"+sup(5),"1"+MN+"3")+"=242."));
  s+=topic("7.5 &nbsp;Recursive rules &amp; models",
    "<p>Arithmetic: a"+sub("n")+"=a"+sub("n&minus;1")+"+d. Geometric: a"+sub("n")+"=r"+CD+"a"+sub("n&minus;1")+". A model a"+sub("n")+"=r"+CD+"a"+sub("n&minus;1")+"+c (loans, populations) settles to a <span class='key'>steady state</span> L where L=rL+c.</p>"
    +eg("a"+sub(1)+"=200, a"+sub("n")+"=0.2a"+sub("n&minus;1")+"+200 "+TO+" L=0.2L+200 "+TO+" L=250."));
  s+=pit("Decide arithmetic vs. geometric first (difference constant or ratio constant?). In the geometric rule the exponent is n"+MN+"1, not n. You can only sum an infinite geometric series when |r|&lt;1.");
  s+='</div>';

  /* ---------- CHAPTER 8 ---------- */
  s+='<div class="chapsec"><h2>Chapter 8 &middot; Trigonometric Ratios &amp; Functions</h2>';
  s+=topic("8.1 &nbsp;Right-triangle trig",
    "<p><span class='key'>SOH-CAH-TOA:</span> sin"+TH+"="+fr("opp","hyp")+", cos"+TH+"="+fr("adj","hyp")+", tan"+TH+"="+fr("opp","adj")+". Reciprocals: csc="+fr("1","sin")+", sec="+fr("1","cos")+", cot="+fr("1","tan")+". Special triangles: 45-45-90 (1:1:"+sq("2")+"), 30-60-90 (1:"+sq("3")+":2). Solve a triangle by finding every missing side and angle.</p>"
    +eg("A 25-ft ladder at 65"+DEG+" to the ground reaches 25 sin65"+DEG+" "+AP+" 22.7 ft up the wall."));
  s+=topic("8.2 &nbsp;Angles, radians, arcs",
    "<p>Standard position: vertex at origin, initial side on the +x-axis. <span class='key'>Coterminal</span> angles differ by 360"+DEG+" (or 2"+PI+"). Convert with 180"+DEG+"="+PI+".</p>"
    +fbox("Arc length s=r"+TH+" &nbsp;&bull;&nbsp; Sector area A="+fr("1","2")+pw("r","2")+TH+" &nbsp;("+TH+" in radians)")
    +eg("135"+DEG+CD+fr(PI,"180")+"="+fr("3"+PI,"4")+" rad. &nbsp;Radius 8, angle "+fr("3"+PI,"4")+": s=8"+CD+fr("3"+PI,"4")+"=6"+PI+"."));
  s+=topic("8.3&ndash;8.4 &nbsp;Any angle &amp; the unit circle",
    "<p>For a point (x,y) on the terminal side with r="+sq("x"+sup(2)+"+y"+sup(2))+": sin"+TH+"="+fr("y","r")+", cos"+TH+"="+fr("x","r")+", tan"+TH+"="+fr("y","x")+". The <span class='key'>reference angle</span> "+TH+"&prime; is the acute angle to the x-axis; evaluate with it, then attach the sign from the quadrant (<span class='key'>ASTC</span>: All, Sine, Tangent, Cosine positive in QI&ndash;QIV). On the unit circle a point is (cos"+TH+", sin"+TH+").</p>"
    +eg("cos210"+DEG+": QIII (cosine negative), reference 30"+DEG+" "+TO+" "+MN+fr(sq("3"),"2")+"."));
  s+=topic("8.5 &nbsp;Graphing sine &amp; cosine",
    "<p>For y=a sin b(x"+MN+"h)+k (and cosine): <span class='key'>amplitude |a|, period "+fr("2"+PI,"b")+", phase shift h, midline y=k</span>. Plot 5 key points by splitting one period into quarters; if a&lt;0, reflect over the midline.</p>"
    +eg("y=3 sin2x: amp 3, period "+PI+", key x-values 0, "+fr(PI,"4")+", "+fr(PI,"2")+", "+fr("3"+PI,"4")+", "+PI+"."));
  s+=topic("8.6 &nbsp;Tangent, cotangent, secant, cosecant",
    "<p>tan x and cot x have <span class='key'>period "+PI+"</span>: tan has asymptotes where cos x=0 ("+fr(PI,"2")+"+"+PI+"n), cot where sin x=0 ("+PI+"n). sec x="+fr("1","cos x")+" and csc x="+fr("1","sin x")+" have period 2"+PI+" with asymptotes where the denominator is 0 &mdash; sketch cos/sin first, then take reciprocals.</p>");
  s+=pit("Arc length and sector area need "+TH+" in <u>radians</u>, not degrees. The period is "+fr("2"+PI,"b")+" (divide by b, don't multiply). A reference angle gives only the size of the value &mdash; the quadrant gives the sign.");
  s+='</div>';

  s+='</div>'; /* .rev */
  return s;
}

/* =================== RENDER =================== */
function renderQuiz(qi){
  var Q=QUIZZES[qi], n=qi+1;
  var chal=(Q.level==="chal");
  var s='<h2 class="qh">Mock Quiz '+n
    +'<span class="badge '+(chal?"chal":"std")+'">'+(chal?"Challenge":"Standard")+'</span></h2>';
  s+='<div class="meta">'+Q.problems.length+' problems &middot; covers Chapters 5&ndash;8'
    +(chal?' &middot; expect multi-step reasoning':' &middot; '+(chal?'':'')+'<span class="star">&#9733;</span> marks a harder problem')
    +' &middot; answers under the Answer Keys tab.</div>';
  s+='<div class="toolbar noprint"><button onclick="printOnly(\'sec-q'+qi+'\')">Print this quiz</button>'
    +'<button onclick="go(\'ak\')">Go to answer keys</button>'
    +'<span class="note">Tip: try it timed and closed-book first.</span></div>';
  s+='<ol class="problems">';
  Q.problems.forEach(function(p,i){
    s+='<li><span class="num">'+(i+1)+'.</span><span class="qtext">'
      +(p.hard?'<span class="star">&#9733; </span>':'')+p.q+'</span>'
      +(p.grid?p.grid:'')+'</li>';
  });
  s+='</ol>';
  return s;
}
function renderAnswerKeys(){
  var s='<h2 class="qh">Answer Keys</h2>';
  s+='<div class="meta">Worked answers for all ten quizzes. Grade yourself honestly.</div>';
  s+='<div class="toolbar noprint"><button onclick="printOnly(\'sec-ak\')">Print all answer keys</button></div>';
  QUIZZES.forEach(function(Q,qi){
    s+='<div class="akblock" id="ak'+qi+'"><h3>Quiz '+(qi+1)+' '+(Q.level==="chal"?'(Challenge)':'')+'</h3><ol class="answers">';
    Q.problems.forEach(function(p){ s+='<li>'+p.a+'</li>'; });
    s+='</ol></div>';
  });
  return s;
}

/* build sections + tabs */
var view=document.getElementById('view');
var tabs=document.getElementById('tabs');
var sections=[];

function addSection(id,label,html){
  var sec=document.createElement('section');
  sec.className='view'; sec.id='sec-'+id;
  sec.innerHTML=html;
  view.appendChild(sec);
  var b=document.createElement('button');
  b.textContent=label; b.dataset.target=id;
  b.onclick=function(){go(id);};
  tabs.appendChild(b);
  sections.push({id:id,btn:b,el:sec});
}

addSection('home','Study Guide',homeSection());
for(var i=0;i<QUIZZES.length;i++){ addSection('q'+i,'Quiz '+(i+1),renderQuiz(i)); }
// spacer
var sp=document.createElement('span'); sp.className='sp'; tabs.appendChild(sp);
addSection('ak','Answer Keys',renderAnswerKeys());
addSection('cheat','Cheat Sheet',cheatSheet());

function go(id){
  sections.forEach(function(o){
    var on=(o.id===id);
    o.el.classList.toggle('active',on);
    o.btn.classList.toggle('active',on);
  });
  window.scrollTo(0,0);
}
function printOnly(secId){
  // ensure the target section is the only active one, then print
  var target=secId.replace('sec-','');
  go(target);
  setTimeout(function(){ window.print(); },60);
}
go('home');
</script>
